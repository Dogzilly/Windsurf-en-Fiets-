<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WindFiets">
<meta name="description" content="Windsurf-windalerts voor Nederlandse spots en fietswind, met RWS-metingen en Open-Meteo-prognoses.">
<meta name="theme-color" content="#f0f4f8" id="themeColor"><title>Windsurf en Fiets v%VERSION%</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;background:#f0f4f8}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.fade-in{animation:fadeIn 0.4s ease}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #2b6cb0;outline-offset:2px}
.spots-grid{display:block}
.settings-grid{display:block}
@media (min-width:900px){
  .spots-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
  .settings-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;align-items:start}
  .home-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>
<noscript>Deze app heeft JavaScript nodig.</noscript>
<div id="root"></div>
<script src="app.js?v=%VERSION%"></script>
</body></html>
