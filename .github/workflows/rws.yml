# Haalt elk half uur RWS-metingen (ddapi20) op en commit data/rws.json, zodat de app
# (GitHub Pages, zonder eigen server) actuele metingen same-origin kan lezen.
# - Geplande runs lopen soms vertraging op of worden door GitHub overgeslagen.
# - Commits met GITHUB_TOKEN starten geen nieuwe workflows (geen lus); ze geven wel
#   één Pages-build per snapshot (max ~48 per dag, ruim binnen de limiet).
# - Alleen data/rws.json wordt gecommit; de rest van de site blijft ongemoeid.
name: RWS metingen ophalen
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: rws, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-rws.mjs
      - name: Commit als er iets veranderd is
        run: |
          git config user.name "rws-bot"
          git config user.email "rws-bot@users.noreply.github.com"
          git add data/rws.json
          if git diff --cached --quiet; then echo "geen wijziging"; exit 0; fi
          git commit -m "data: RWS-metingen bijgewerkt"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
